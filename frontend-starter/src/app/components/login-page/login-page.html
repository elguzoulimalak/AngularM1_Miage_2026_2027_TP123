<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>Email
      <input type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="showError('email')" />
    </label>
    @if (showError('email')) {
      <small class="error">
        {{ form.controls.email.hasError('required') ? 'L’email est obligatoire.' : 'Format d’email invalide.' }}
      </small>
    }
    <label>Mot de passe
      <input type="password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="showError('password')" />
    </label>
    @if (showError('password')) {
      <small class="error">Le mot de passe est obligatoire.</small>
    }
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <p><a routerLink="/register">Créer un compte</a></p>
</section>
